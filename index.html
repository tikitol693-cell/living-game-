  <script>
    try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (e) {}

    let audioCtx = null;
    function playBeep(freq, dur) {
      if (!s.sound) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const dailyRewards =;

    let s = {
      score: 0, tap: 1, pas: 0, en: 1000, maxEn: 1000, reg: 3,
      cTap: 250, cPas: 1000, cEn: 800, cReg: 2000,
      uTap: 0, uPas: 0, uEn: 0, uReg: 0,
      sound: true, x2Left: 0, x2Cd: 0,
      dailyDay: 0, lastDaily: 0
    };

    try { let d = localStorage.getItem('litvin_v5'); if (d) s = Object.assign(s, JSON.parse(d)); } catch (e) {}
    function save() { try { localStorage.setItem('litvin_v5', JSON.stringify(s)); } catch (e) {} }

    function getLevelInfo(score) {
      let lvl = Math.min(100, Math.floor(Math.pow(score / 1000, 1 / 3)) + 1);
      if (score < 1000) lvl = 1;
      let nextScore = Math.pow(lvl, 3) * 1000;
      return { lvl, nextScore };
    }

    function renderDaily() {
      const grid = document.getElementById('dailyGrid');
      grid.innerHTML = '';
      dailyRewards.forEach((rew, idx) => {
        let cls = 'day-box';
        if (idx < s.dailyDay) cls += ' done';
        else if (idx === s.dailyDay) cls += ' current';
        grid.innerHTML += '<div class="' + cls + '"><b>День ' + (idx + 1) + '</b><br><span style="color:#ffd700;">+' + rew.toLocaleString('ru-RU') + '</span></div>';
      });

      const btn = document.getElementById('claimDailyBtn');
      const now = Date.now();
      const dayMs = 24 * 60 * 60 * 1000;
      if (s.dailyDay >= dailyRewards.length) {
        btn.innerText = 'Все награды получены!';
        btn.style.background = '#444';
      } else if (now - s.lastDaily >= dayMs) {
        btn.innerText = '🎁 Забрать +' + dailyRewards[s.dailyDay].toLocaleString('ru-RU') + ' 💰';
        btn.style.background = '#00e676';
      } else {
        let leftHrs = Math.ceil((dayMs - (now - s.lastDaily)) / (1000 * 60 * 60));
        btn.innerText = '⏳ Доступно через ~' + leftHrs + ' ч.';
        btn.style.background = '#444';
      }
    }
    function claimDaily() {
      const now = Date.now();
      const dayMs = 24 * 60 * 60 * 1000;
      if (s.dailyDay < dailyRewards.length && now - s.lastDaily >= dayMs) {
        let prize = dailyRewards[s.dailyDay];
        s.score += prize;
        s.dailyDay++;
        s.lastDaily = now;
        playBeep(800, 0.25);
        render(); save();
        try { window.Telegram.WebApp.showAlert('Получено +' + prize.toLocaleString('ru-RU') + ' монет!'); } catch (e) {}
      }
    }

    function render() {
      let mult = s.x2Left > 0 ? 2 : 1;
      document.getElementById('scoreText').innerText = Math.floor(s.score).toLocaleString('ru-RU');
      document.getElementById('tapText').innerText = (s.tap * mult).toLocaleString('ru-RU') + (mult > 1 ? ' (x2)' : '');
      document.getElementById('pasText').innerText = s.pas.toLocaleString('ru-RU');
      document.getElementById('enText').innerText = Math.floor(s.en);
      document.getElementById('maxEnText').innerText = s.maxEn;
      document.getElementById('enFill').style.width = (s.en / s.maxEn * 100) + '%';

      let info = getLevelInfo(s.score);
      document.getElementById('lvlText').innerText = info.lvl + ' / 100';
      document.getElementById('nextLvlNeed').innerText = info.lvl >= 100 ? 'МАКСИМУМ!' : Math.max(0, Math.floor(info.nextScore - s.score)).toLocaleString('ru-RU');

      document.getElementById('cTap').innerText = s.cTap.toLocaleString('ru-RU') + ' 💰';
      document.getElementById('cPas').innerText = s.cPas.toLocaleString('ru-RU') + ' 💰';
      document.getElementById('cEn').innerText = s.cEn.toLocaleString('ru-RU') + ' 💰';
      document.getElementById('cReg').innerText = s.cReg.toLocaleString('ru-RU') + ' 💰';

      document.getElementById('uTapLvl').innerText = s.uTap;
      document.getElementById('uPasLvl').innerText = s.uPas;
      document.getElementById('uEnLvl').innerText = s.uEn;
      document.getElementById('uRegLvl').innerText = s.uReg;

      document.getElementById('soundToggle').innerText = s.sound ? 'ВКЛ' : 'ВЫКЛ';
      document.getElementById('soundToggle').style.background = s.sound ? '#00e676' : '#555';

      const x2Btn = document.getElementById('x2Btn');
      const tapBtn = document.getElementById('tapBtn');
      if (s.x2Left > 0) {
        x2Btn.innerText = '🔥 x2 АКТИВЕН: ' + s.x2Left + ' сек';
        x2Btn.classList.remove('disabled');
        tapBtn.classList.add('x2-active');
      } else if (s.x2Cd > 0) {
        x2Btn.innerText = '⏳ Перезарядка x2: ' + s.x2Cd + ' сек';
        x2Btn.classList.add('disabled');
        tapBtn.classList.remove('x2-active');
      } else {
        x2Btn.innerText = '⚡ Включить x2 на 1 минуту';
        x2Btn.classList.remove('disabled');
        tapBtn.classList.remove('x2-active');
      }
      renderDaily();
    }

    let lastTouch = 0;
    function doTap(e) {
      if (e) e.preventDefault();
      let now = Date.now();
      if (now - lastTouch < 35) return;
      lastTouch = now;

      if (s.en >= s.tap) {
        let mult = s.x2Left > 0 ? 2 : 1;
        s.score += s.tap * mult;
        s.en -= s.tap;
        playBeep(450, 0.05);
        try { window.Telegram.WebApp.HapticFeedback.impactOccurred('light'); } catch (err) {}
        render(); save();
      }
    }

    function activateX2() {
      if (s.x2Left > 0 || s.x2Cd > 0) return;
      s.x2Left = 60;
      s.x2Cd = 180;
      playBeep(750, 0.2);
      render(); save();
    }

    function buy(type) {
      if (type === 'tap' && s.score >= s.cTap) { s.score -= s.cTap; s.tap += 2; s.uTap++; s.cTap = Math.floor(s.cTap * 1.65); }
      else if (type === 'pas' && s.score >= s.cPas) { s.score -= s.cPas; s.pas += 10; s.uPas++; s.cPas = Math.floor(s.cPas * 1.75); }
      else if (type === 'en' && s.score >= s.cEn) { s.score -= s.cEn; s.maxEn += 500; s.en = s.maxEn; s.uEn++; s.cEn = Math.floor(s.cEn * 1.7); }
      else if (type === 'reg' && s.score >= s.cReg) { s.score -= s.cReg; s.reg += 2; s.uReg++; s.cReg = Math.floor(s.cReg * 1.8); }
      else return;
      playBeep(600, 0.12);
      render(); save();
    }

    function openTab(id, btn) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
      playBeep(350, 0.04);
    }

    function toggleSound() {
      s.sound = !s.sound;
      if (s.sound) playBeep(550, 0.1);
      render(); save();
    }

    function contactCreator() {
      const url = "https://t.me";
      try { window.Telegram.WebApp.openTelegramLink(url); } catch (e) { window.open(url, '_blank'); }
    }

    function resetGame() {
      if (confirm('Точно сбросить весь прогресс до 0?')) {
        localStorage.removeItem('litvin_v5');
        location.reload();
      }
    }

    setInterval(() => {
      if (s.pas > 0) s.score += s.pas;
      if (s.en < s.maxEn) s.en = Math.min(s.maxEn, s.en + s.reg);
      if (s.x2Left > 0) s.x2Left--;
      else if (s.x2Cd > 0) s.x2Cd--;
      render(); save();
    }, 1000);

    render();
  </script>
</body>
</html>
