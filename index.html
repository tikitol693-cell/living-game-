<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Литвин Тапочка</title>
  <script src="https://telegram.org"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      /* ЗАДНИЙ ФОН С ЛИТВИНОМ */
      background-color: #111;
      background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.85)), url('litvin.jpg');
      background-size: cover;
      background-position: center;
    }

    .top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      border: 1px solid #ffd700;
    }

    .score-box {
      text-align: center;
    }

    .score {
      font-size: 46px;
      font-weight: 900;
      color: #00e676;
      text-shadow: 0 0 15px rgba(0, 230, 118, 0.6);
    }

    .tap-btn {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 130, 60, 0.85), rgba(10, 40, 20, 0.95));
      border: 6px solid #00e676;
      box-shadow: 0 0 30px rgba(0, 230, 118, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      cursor: pointer;
      position: relative;
      z-index: 999;
    }

    .tap-btn:active {
      transform: scale(0.92);
      border-color: #ffd700;
    }

    .bottom {
      width: 100%;
      max-width: 380px;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #444;
    }

    .energy-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .fill {
      height: 100%;
      background: #00e676;
      width: 100%;
    }

    .shop {
      display: flex;
      gap: 8px;
    }

    .shop button {
      flex: 1;
      background: #222;
      color: #fff;
      border: 1px solid #00e676;
      padding: 10px 6px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="top">
    <span>🏆 Ур. <b id="lvl">1</b></span>
    <span>Создатель: <b style="color:#ffd700;">Степан Шаимов</b></span>
  </div>

  <div class="score-box">
    <div class="score" id="score">0</div>
    <div style="font-size:13px; color:#ccc;">Тап: +<span id="power">1</span> | Пассив: +<span id="pas">0</span>/с</div>
  </div>

  <!-- ГЛАВНАЯ КНОПКА -->
  <div class="tap-btn" id="btn" ontouchstart="doTap(event)" onclick="doTap(event)">
    <div style="font-size: 50px; margin-bottom: 5px;">🐆🔥</div>
    ТАНЦУЙ<br>ПАНТЕРА
  </div>

  <div class="bottom">
    <div class="energy-info">
      <span>⚡ Энергия</span>
      <span><span id="en">1000</span> / <span id="maxEn">1000</span></span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    
    <div class="shop">
      <button ontouchstart="buyTap(event)" onclick="buyTap(event)">
        🥫 +1 тап<br><span style="color:#ffd700;" id="cTap">100</span> 💰
      </button>
      <button ontouchstart="buyPas(event)" onclick="buyPas(event)" style="border-color:#ffd700;">
        🔥 +5/сек<br><span style="color:#ffd700;" id="cPas">300</span> 💰
      </button>
    </div>
  </div>

  <script>
    try {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    } catch (e) {}

    let data = {
      score: 0,
      power: 1,
      pas: 0,
      en: 1000,
      maxEn: 1000,
      cTap: 100,
      cPas: 300
    };

    try {
      let saved = localStorage.getItem('litvin_fix_v2');
      if (saved) data = Object.assign(data, JSON.parse(saved));
    } catch (e) {}

    let lastTouch = 0;

    function render() {
      document.getElementById('score').innerText = Math.floor(data.score).toLocaleString('ru-RU');
      document.getElementById('power').innerText = data.power;
      document.getElementById('pas').innerText = data.pas;
      document.getElementById('en').innerText = Math.floor(data.en);
      document.getElementById('maxEn').innerText = data.maxEn;
      document.getElementById('fill').style.width = (data.en / data.maxEn * 100) + '%';
      document.getElementById('cTap').innerText = data.cTap;
      document.getElementById('cPas').innerText = data.cPas;
      document.getElementById('lvl').innerText = Math.floor(Math.log10(data.score + 10));
    }

    function save() {
      try { localStorage.setItem('litvin_fix_v2', JSON.stringify(data)); } catch (e) {}
    }

    function doTap(e) {
      if (e) e.preventDefault();
      // Защита от двойного срабатывания touch + click
      let now = Date.now();
      if (now - lastTouch < 40) return;
      lastTouch = now;

      if (data.en >= data.power) {
        data.score += data.power;
        data.en -= data.power;
        try { window.Telegram.WebApp.HapticFeedback.impactOccurred('light'); } catch (err) {}
        render();
        save();
      }
    }

    function buyTap(e) {
      if (e) e.preventDefault();
      if (data.score >= data.cTap) {
        data.score -= data.cTap;
        data.power += 1;
        data.cTap = Math.floor(data.cTap * 1.6);
        render();
        save();
      }
    }

    function buyPas(e) {
      if (e) e.preventDefault();
      if (data.score >= data.cPas) {
        data.score -= data.cPas;
        data.pas += 5;
        data.cPas = Math.floor(data.cPas * 1.7);
        render();
        save();
      }
    }

    setInterval(function() {
      if (data.pas > 0) data.score += data.pas;
      if (data.en < data.maxEn) data.en = Math.min(data.maxEn, data.en + 4);
      render();
      save();
    }, 1000);

    render();
  </script>
</body>
</html>
