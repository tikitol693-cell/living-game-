<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Литвин Тапочка</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      /* ФОН С ЛИТВИНОМ: убедитесь, что файл litvin.jpg загружен на GitHub рядом с index.html */
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.85)), 
                  url('litvin.jpg') center/cover no-repeat;
      background-color: #0d1015;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #ffd700;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }

    .score-area { text-align: center; margin-top: 5px; }
    .score { font-size: 44px; font-weight: 900; text-shadow: 0 2px 15px rgba(0, 230, 118, 0.7); }
    .sub-info { font-size: 13px; color: #ddd; margin-top: 2px; }

    /* Зона тапалки */
    .tap-zone {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tap-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29, 185, 84, 0.35) 0%, rgba(10, 40, 20, 0.75) 100%);
      border: 5px solid #00e676;
      box-shadow: 0 0 35px rgba(0, 230, 118, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      cursor: pointer;
      transition: transform 0.05s;
      z-index: 10;
    }

    .tap-btn.pressed { transform: scale(0.92); border-color: #ffd700; }

    /* Всплывающие цифры при тапе */
    .float-num {
      position: absolute;
      font-size: 28px;
      font-weight: 900;
      color: #00e676;
      text-shadow: 0 2px 8px #000;
      pointer-events: none;
      animation: flyUp 0.7s ease-out forwards;
      z-index: 20;
    }

    @keyframes flyUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
    }
    /* Нижняя панель с энергией и быстрыми улучшениями */
    .bottom-panel {
      width: 100%;
      max-width: 400px;
      background: rgba(15, 18, 24, 0.85);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid #333;
      backdrop-filter: blur(5px);
    }

    .energy-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
    .energy-bar { width: 100%; height: 10px; background: #222; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
    .energy-fill { height: 100%; background: linear-gradient(90deg, #00c853, #ffd600); width: 100%; transition: width 0.15s; }

    .upgrades-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .up-btn {
      background: #1f242d;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 8px;
      text-align: left;
      cursor: pointer;
    }
    .up-btn:active { background: #2c3340; }
    .up-title { font-size: 12px; font-weight: bold; color: #00e676; }
    .up-desc { font-size: 11px; color: #bbb; margin: 2px 0; }
    .up-cost { font-size: 12px; font-weight: bold; color: #ffd700; }
  </style>
</head>
<body>

  <div class="top-bar">
    <span>🏆 Ур. <b id="level">1</b></span>
    <span>Создатель: <b>Степан Шаимов</b></span>
  </div>

  <div class="score-area">
    <div class="score" id="score">0</div>
    <div class="sub-info">Тап: +<b id="tapPower">1</b> • Пассив: +<b id="passive">0</b>/с</div>
  </div>

  <div class="tap-zone" id="tapZone">
    <div class="tap-btn" id="tapBtn">
      <div style="font-size: 46px; margin-bottom: 5px;">🐆🔥</div>
      ТАНЦУЙ<br>ПАНТЕРА
    </div>
  </div>

  <div class="bottom-panel">
    <div class="energy-row">
      <span>⚡ Энергия</span>
      <span><span id="energy">1000</span> / <span id="maxEnergy">1000</span></span>
    </div>
    <div class="energy-bar">
      <div class="energy-fill" id="energyFill"></div>
    </div>

    <div class="upgrades-row">
      <button class="up-btn" id="buyTap">
        <div class="up-title">🥫 Банка LIT</div>
        <div class="up-desc">+1 к силе тапа</div>
        <div class="up-cost">💰 <span id="costTap">100</span></div>
      </button>
      <button class="up-btn" id="buyPassive">
        <div class="up-title">🔥 Сжечь Акулу</div>
        <div class="up-desc">+5 монет/сек</div>
        <div class="up-cost">💰 <span id="costPassive">300</span></div>
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let state = JSON.parse(localStorage.getItem('litvin_only_tap_v1')) || {
      score: 0,
      tapPower: 1,
      passive: 0,
      energy: 1000,
      maxEnergy: 1000,
      costTap: 100,
      costPassive: 300
    };

    function save() {
      localStorage.setItem('litvin_only_tap_v1', JSON.stringify(state));
    }

    function updateUI() {
      document.getElementById('score').innerText = Math.floor(state.score).toLocaleString('ru-RU');
      document.getElementById('tapPower').innerText = state.tapPower;
      document.getElementById('passive').innerText = state.passive;
      document.getElementById('energy').innerText = Math.floor(state.energy);
      document.getElementById('maxEnergy').innerText = state.maxEnergy;
      document.getElementById('energyFill').style.width = (state.energy / state.maxEnergy * 100) + '%';
      document.getElementById('costTap').innerText = state.costTap.toLocaleString('ru-RU');
      document.getElementById('costPassive').innerText = state.costPassive.toLocaleString('ru-RU');
      document.getElementById('level').innerText = Math.floor(Math.log10(state.score + 10));
    }

    // Мгновенная обработка нажатий (работает мультитач в 2-3 пальца)
    const tapBtn = document.getElementById('tapBtn');
    const tapZone = document.getElementById('tapZone');

    tapBtn.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      if (state.energy < state.tapPower) return;

      state.score += state.tapPower;
      state.energy -= state.tapPower;

      // Анимация нажатия
      tapBtn.classList.add('pressed');
      setTimeout(() => tapBtn.classList.remove('pressed'), 60);

      // Вибрация
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      // Всплывающая цифра в месте касания
      const rect = tapZone.getBoundingClientRect();
      const num = document.createElement('div');
      num.className = 'float-num';
      num.innerText = '+' + state.tapPower;
      num.style.left = (e.clientX - rect.left - 15) + 'px';
      num.style.top = (e.clientY - rect.top - 25) + 'px';
      tapZone.appendChild(num);
      setTimeout(() => num.remove(), 700);

      updateUI();
      save();
    });

    // Покупка силы тапа
    document.getElementById('buyTap').addEventListener('pointerdown', function() {
      if (state.score >= state.costTap) {
        state.score -= state.costTap;
        state.tapPower += 1;
        state.costTap = Math.floor(state.costTap * 1.6);
        updateUI();
        save();
      }
    });

    // Покупка пассивного дохода
    document.getElementById('buyPassive').addEventListener('pointerdown', function() {
      if (state.score >= state.costPassive) {
        state.score -= state.costPassive;
        state.passive += 5;
        state.costPassive = Math.floor(state.costPassive * 1.7);
        updateUI();
        save();
      }
    });

    // Восстановление энергии и пассивный доход раз в секунду
    setInterval(() => {
      if (state.passive > 0) state.score += state.passive;
      if (state.energy < state.maxEnergy) state.energy = Math.min(state.maxEnergy, state.energy + 5);
      updateUI();
      save();
    }, 1000);

    updateUI();
  </script>
</body>
</html>
