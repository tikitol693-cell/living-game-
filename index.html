<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Litvin Tap</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;background:#0a0b0e;color:#fff;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100dvh;overflow:hidden;touch-action:manipulation}
.top{width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.gd{background:linear-gradient(135deg,#332600,#1f1800);border:1.5px solid #ffd600;color:#ffd600;font-size:12px;font-weight:900;padding:6px 10px;border-radius:20px;cursor:pointer;box-shadow:0 0 12px rgba(255,214,0,.25);white-space:nowrap}
.gd:active,.rk:active,.mb:active,.bn:active{transform:scale(.95)}
.rk{background:#181a20;border:1px solid #00e676;color:#00e676;font-size:11px;font-weight:800;padding:6px 10px;border-radius:20px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd{text-align:center;width:100%;max-width:400px}
.sc{font-size:38px;font-weight:900;margin:2px 0;text-shadow:0 0 20px rgba(0,230,118,.45)}
.in{font-size:12px;color:#8e929b;margin-bottom:5px}
.br{width:100%;height:7px;background:#1c1e24;border-radius:7px;overflow:hidden}
.fl{height:100%;background:linear-gradient(90deg,#00c853,#00e676);width:0%;transition:width .15s}
.mbar{width:100%;max-width:400px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.mb{background:#161821;border:1px solid #2b2f3c;color:#fff;font-size:11px;font-weight:800;padding:7px 4px;border-radius:12px;cursor:pointer;text-align:center}
.mb.gold{border-color:#ffd600;color:#ffd600}
.zn{position:relative;display:flex;justify-content:center;align-items:center;flex:1;width:100%;cursor:pointer}
.cn{width:185px;height:185px;border-radius:50%;background:radial-gradient(circle,#1db954 0%,#073b19 100%);border:5px solid #00e676;box-shadow:0 0 38px rgba(0,230,118,.4);display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform .07s;overflow:hidden;pointer-events:none}
.cn.x2{background:radial-gradient(circle,#ff9100 0%,#5e2600 100%);border-color:#ffd600;box-shadow:0 0 55px rgba(255,214,0,.9)}
.cn img{width:100%;height:100%;object-fit:cover}
.em{font-size:56px}.tx{font-size:19px;font-weight:900;margin-top:4px;letter-spacing:1px}
.pt{position:absolute;font-size:26px;font-weight:900;color:#fff;pointer-events:none;animation:up .65s ease-out forwards;z-index:10;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.pt.g{color:#ffd600;font-size:32px}
@keyframes up{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-95px) scale(1.2)}}
.bt{width:100%;max-width:400px}
.et{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:3px}
.eb{width:100%;height:9px;background:#1c1e24;border-radius:10px;overflow:hidden;margin-bottom:8px}
.ef{height:100%;background:linear-gradient(90deg,#00c853,#69f0ae);width:100%}
.sh{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bn{background:#15171c;border:1px solid #282b34;border-radius:12px;padding:9px;color:#fff;text-align:left;cursor:pointer}
.bn.off{opacity:.4}
.t1{font-weight:800;font-size:12px;color:#00e676}.t2{font-size:10px;color:#9aa0a6;margin:2px 0}.t3{font-size:12px;font-weight:800}
.md{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;justify-content:center;align-items:center;z-index:50;padding:16px}
.md.on{display:flex}
.mc{background:#16181f;border:2px solid #00e676;border-radius:18px;padding:16px;width:100%;max-width:350px;max-height:84dvh;display:flex;flex-direction:column}
.mc.ymd{border-color:#ffd600}
.ml{overflow-y:auto;margin:10px 0;display:flex;flex-direction:column;gap:7px}
.ri{background:#1e212b;border:1px solid #2c303a;border-radius:11px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.ri.cur{border-color:#00e676;background:#132b1e}.ri.lk{opacity:.45}
.cl{width:100%;padding:11px;border-radius:11px;border:none;background:#00e676;color:#000;font-weight:900;font-size:14px;cursor:pointer;margin-top:6px}
.cl.y{background:#ffd600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.cell{height:64px;background:#222632;border:1px solid #353b4d;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:24px;font-weight:900;cursor:pointer}
.cell.open{background:#13161f;border-color:#00e676}.cell.bomb{background:#3b1219;border-color:#ff5252}
.act{width:100%;padding:10px;border-radius:11px;border:1px solid #343948;background:#212531;color:#fff;font-weight:800;font-size:12px;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div class="top">
  <button class="gd" id="bGd">🪙 КОЧ ГОЛДА: <span id="gv">0</span></button>
  <button class="rk" id="rk">🏆 Ур. 1 ▾</button>
</div>
<div class="hd">
  <div class="sc" id="sc">0</div>
  <div class="in">Пассив: +<span id="ps">0</span>/с • Тап: +<span id="tv">1</span> (x<span id="ml">1</span>)</div>
  <div class="br"><div class="fl" id="lB"></div></div>
  <div class="mbar">
    <button class="mb" id="bC">🎁 Кейс</button>
    <button class="mb gold" id="bM1">🎰 Рулетка</button>
    <button class="mb gold" id="bM2">💣 Сапёр</button>
  </div>
</div>
<div class="zn" id="zn">
  <div class="cn" id="cn">
    <img src="litvin.jpg" onerror="this.style.display='none';document.getElementById('fb').style.display='block'">
    <div id="fb" style="display:none;text-align:center"><div class="em">🔥⚡</div><div class="tx">ЛИТВИН</div></div>
  </div>
</div>
<div class="bt">
  <div class="et"><span>⚡ Энергия</span><span><span id="en">500</span> / <span id="me">500</span></span></div>
  <div class="eb"><div class="ef" id="eB"></div></div>
  <div class="sh">
    <button class="bn" id="b1"><div class="t1">🥫 Банка LIT</div><div class="t2">+1 к тапу</div><div class="t3">💰 <span id="p1">50</span></div></button>
    <button class="bn" id="b2"><div class="t1">🔥 Сжечь Акулу</div><div class="t2">+4 в сек</div><div class="t3">💰 <span id="p2">150</span></div></button>
    <button class="bn" id="b3"><div class="t1">🔋 Запас сил</div><div class="t2">+300 энергии</div><div class="t3">💰 <span id="p3">200</span></div></button>
    <button class="bn" id="b4"><div class="t1" style="color:#ffd600">🚀 Полный бак</div><div class="t2">100% энергии</div><div class="t3" id="s4">БЕСПЛАТНО</div></button>
  </div>
</div>
<div class="md" id="md">
  <div class="mc" id="mc">
    <div id="mTitle" style="font-size:17px;font-weight:900;color:#00e676;text-align:center"></div>
    <div id="mBody" class="ml"></div>
    <button class="cl" id="mCl">Закрыть</button>
  </div>
</div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const R=[["Ур. 1 • Новичок",0,1],["Ур. 2 • Суетолог",1000,1.2],["Ур. 3 • Фанат LIT",5000,1.5],["Ур. 4 • Поджигатель",20000,2],["Ур. 5 • Хозяин Акулы",80000,2.5],["Ур. 6 • Кондиции",250000,3],["Ур. 7 • Миллионер",1000000,4],["Ур. 8 • Магнат",5000000,5],["Ур. 9 • Император",25000000,7],["Ур. 10 • Легенда",100000000,10]];
let s={sc:0,tt:0,gd:5,tp:1,ps:0,en:500,me:500,p1:50,p2:150,p3:200,rf:0,cs:0,gMult:1,rkClaimed:0};
try{const d=localStorage.getItem('litV11');if(d)s={...s,...JSON.parse(d)}}catch(e){}
let combo=0,x2=0,lt=0;
const el=id=>document.getElementById(id),cn=el('cn'),zn=el('zn'),md=el('md'),mc=el('mc');
const sv=()=>{try{localStorage.setItem('litV11',JSON.stringify(s))}catch(e){}},fm=n=>Math.floor(n).toLocaleString('ru-RU');
function pop(t,x,y,g){const r=zn.getBoundingClientRect(),d=document.createElement('div');d.className='pt'+(g?' g':'');d.innerText=t;d.style.left=(x-r.left-25)+'px';d.style.top=(y-r.top-25)+'px';zn.appendChild(d);setTimeout(()=>d.remove(),650)}
function getRankIdx(){let i=0;for(let k=0;k<R.length;k++)if(s.tt>=R[k][1])i=k;return i}
function totalMult(){return +(R[getRankIdx()][2]*s.gMult).toFixed(1)}
function ui(){
const idx=getRankIdx();
if(idx>s.rkClaimed){s.gd+=(idx-s.rkClaimed)*10;s.rkClaimed=idx;sv()}
const m=totalMult();
el('gv').innerText=fm(s.gd);el('sc').innerText=fm(s.sc);el('ps').innerText=fm(s.ps*m);el('tv').innerText=fm(s.tp*m*(x2>0?2:1));el('ml').innerText=m;el('en').innerText=Math.floor(s.en);el('me').innerText=s.me;el('p1').innerText=fm(s.p1);el('p2').innerText=fm(s.p2);el('p3').innerText=fm(s.p3);el('eB').style.width=Math.min(100,s.en/s.me*100)+'%';
el('b1').classList.toggle('off',s.sc<s.p1);el('b2').classList.toggle('off',s.sc<s.p2);el('b3').classList.toggle('off',s.sc<s.p3);el('b4').classList.toggle('off',s.rf>0);el('s4').innerText=s.rf>0?'Ждать: '+s.rf+'с':'БЕСПЛАТНО';
el('bC').classList.toggle('off',s.cs>0);el('bC').innerText=s.cs>0?'🎁 '+s.cs+'с':'🎁 Кейс';cn.className='cn'+(x2>0?' x2':'');
el('rk').innerText='🏆 '+R[idx][0]+' ▾';const nx=R[idx+1];el('lB').style.width=nx?Math.min(100,(s.tt-R[idx][1])/(nx[1]-R[idx][1])*100)+'%':'100%';
}
function showModal(t,h,g){mc.className='mc'+(g?' ymd':'');el('mTitle').style.color=g?'#ffd600':'#00e676';el('mCl').className='cl'+(g?' y':'');el('mTitle').innerText=t;el('mBody').innerHTML=h;md.classList.add('on')}
function openRanks(){
const cur=getRankIdx();
const list=R.map((r,idx)=>{const done=s.tt>=r[1],cls=idx===cur?'ri cur':(done?'ri':'ri lk'),st=idx===cur?'✅ Текущий':(done?'✔ Открыт':'🔒 '+fm(r[1]));return `<div class="${cls}"><div><b>${r[0]}</b><div style="font-size:10px;color:#9aa0a6">Множитель x${r[2]} • Награда +10 🪙</div></div><div style="font-weight:800;color:${done?'#00e676':'#8e929b'}">${st}</div></div>`}).join('');
showModal('🏆 Система рангов',`<div style="text-align:center;font-size:11px;color:#9aa0a6">Всего очков: <b style="color:#fff">${fm(s.tt)}</b></div>`+list,false);
}
function openGoldShop(){
const exRate=Math.max(1000,Math.floor(s.tt*0.05)+1000),multCost=Math.floor(15*s.gMult);
showModal('🪙 КОЧ ГОЛДА — Магазин',`<div style="text-align:center;font-size:12px;color:#ffd600">Баланс: <b>${fm(s.gd)} 🪙 КОЧ ГОЛДЫ</b></div><div class="ri"><div><b>💱 Купить 5 🪙</b><div style="font-size:10px;color:#9aa0a6">Цена: ${fm(exRate)} очков</div></div><button class="gd" id="gBuy">Купить</button></div><div class="ri"><div><b>⚡ Буст навсегда (+0.5x)</b><div style="font-size:10px;color:#9aa0a6">Текущий: x${s.gMult} • Цена: ${multCost} 🪙</div></div><button class="gd" id="gUp">Улучшить</button></div><div class="ri"><div><b>💰 Мешок очков (+50 000)</b><div style="font-size:10px;color:#9aa0a6">Мгновенно • Цена: 10 🪙</div></div><button class="gd" id="gCash">Взять</button></div>`,true);
el('gBuy').onclick=()=>{if(s.sc>=exRate){s.sc-=exRate;s.gd+=5;sv();ui();openGoldShop()}};
el('gUp').onclick=()=>{if(s.gd>=multCost){s.gd-=multCost;s.gMult=+(s.gMult+0.5).toFixed(1);sv();ui();openGoldShop()}};
el('gCash').onclick=()=>{if(s.gd>=10){s.gd-=10;s.sc+=50000;s.tt+=50000;sv();ui();openGoldShop()}};
}
function openRoulette(){
showModal('🎰 Коч-Рулетка',`<div style="text-align:center;font-size:12px;color:#ccc">Ставка: <b>3 🪙</b>. Выбей до <b>30 🪙</b> или джекпот!</div><div id="rRes" style="text-align:center;font-size:24px;font-weight:900;padding:16px;background:#101218;border-radius:12px;color:#ffd600">🎰 ГОТОВ?</div><button class="act" style="background:#ffd600;color:#000" id="rSpin">Крутить за 3 🪙</button>`,true);
el('rSpin').onclick=()=>{if(s.gd<3){el('rRes').innerText='❌ Мало голды!';return}s.gd-=3;sv();ui();el('rSpin').disabled=true;const pr=["0 🪙 (Пусто)","5 🪙","10 🪙","30 🪙 ДЖЕКПОТ!","+25 000 очков","x2 Буст 15с"];let t=0;const iv=setInterval(()=>{el('rRes').innerText=pr[t%pr.length];t++;if(t>14){clearInterval(iv);const w=Math.floor(Math.random()*pr.length);el('rRes').innerText='🎉 '+pr[w];if(w===1)s.gd+=5;if(w===2)s.gd+=10;if(w===3)s.gd+=30;if(w===4){s.sc+=25000;s.tt+=25000}if(w===5)x2=15;sv();ui();el('rSpin').disabled=false}},80)};
}
function openSaper(){
if(s.gd<2){showModal('💣 Сапёр','<div style="text-align:center;padding:15px">Нужно минимум 2 🪙 голды!</div>',true);return}
s.gd-=2;sv();ui();let bomb=Math.floor(Math.random()*9),bank=0,act=true;
const cells=Array.from({length:9},(_,i)=>`<div class="cell" data-i="${i}">❓</div>`).join('');
showModal('💣 Коч-Сапёр',`<div style="text-align:center;font-size:12px;color:#ccc">Открывай клетки (+2 🪙), но берегись бомбы!</div><div style="text-align:center;font-weight:900;color:#00e676">Банк: <span id="sBank">0</span> 🪙</div><div class="grid3" id="sGrid">${cells}</div><button class="act" style="background:#00e676;color:#000" id="sTake">Забрать банк</button>`,true);
el('sGrid').onclick=e=>{const c=e.target.closest('.cell');if(!c||!act||c.classList.contains('open'))return;if(+c.dataset.i===bomb){c.classList.add('bomb');c.innerText='💥';act=false;bank=0;el('sBank').innerText='0 (Сгорел!)'}else{c.classList.add('open');c.innerText='🪙';bank+=2;el('sBank').innerText=bank}};
el('sTake').onclick=()=>{if(bank>0&&act){s.gd+=bank;act=false;sv();ui();md.classList.remove('on')}};
}
function tap(x,y){
if(s.en<s.tp)return;const cr=Math.random()<0.08,g=Math.max(1,Math.floor(s.tp*totalMult()*(x2>0?2:1)*(cr?5:1)));
s.sc+=g;s.tt+=g;s.en-=s.tp;if(Math.random()<0.015){s.gd+=1;pop('+1 🪙',x,y-25,true)}
combo++;if(combo>=15&&x2<=0){x2=8;combo=0}
const r=cn.getBoundingClientRect(),dx=((x||r.left+r.width/2)-(r.left+r.width/2))/8,dy=((y||r.top+r.height/2)-(r.top+r.height/2))/8;
cn.style.transform=`scale(0.92) rotateX(${-dy}deg) rotateY(${dx}deg)`;setTimeout(()=>{cn.style.transform='scale(1)'},80);
try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred(cr?'heavy':'light')}catch(e){}
pop((cr?'⚡+':'+')+fm(g),x||r.left+r.width/2,y||r.top+r.height/2,cr||x2>0);ui();
}
zn.addEventListener('touchstart',e=>{e.preventDefault();lt=Date.now();for(let i=0;i<e.changedTouches.length;i++)tap(e.changedTouches[i].clientX,e.changedTouches[i].clientY)},{passive:false});
zn.addEventListener('mousedown',e=>{if(Date.now()-lt<500)return;tap(e.clientX,e.clientY)});
el('bGd').onclick=openGoldShop;el('rk').onclick=openRanks;el('bM1').onclick=openRoulette;el('bM2').onclick=openSaper;
el('mCl').onclick=()=>md.classList.remove('on');md.onclick=e=>{if(e.target===md)md.classList.remove('on')};
el('b1').onclick=()=>{if(s.sc>=s.p1){s.sc-=s.p1;s.tp++;s.p1=Math.ceil(s.p1*1.55);sv();ui()}};
el('b2').onclick=()=>{if(s.sc>=s.p2){s.sc-=s.p2;s.ps+=4;s.p2=Math.ceil(s.p2*1.65);sv();ui()}};
el('b3').onclick=()=>{if(s.sc>=s.p3){s.sc-=s.p3;s.me+=300;s.en+=300;s.p3=Math.ceil(s.p3*1.55);sv();ui()}};
el('b4').onclick=()=>{if(!s.rf){s.en=s.me;s.rf=60;sv();ui()}};
el('bC').onclick=()=>{if(!s.cs){const rw=Math.max(100,Math.floor((s.ps*15+s.tp*30)*totalMult()));s.sc+=rw;s.tt+=rw;s.gd+=2;s.cs=120;const r=zn.getBoundingClientRect();pop('🎁+'+fm(rw)+' & +2 🪙',r.left+r.width/2,r.top+r.height/3,true);sv();ui()}};
setInterval(()=>{if(s.ps){const p=Math.floor(s.ps*totalMult());s.sc+=p;s.tt+=p}if(s.en<s.me)s.en=Math.min(s.me,s.en+3);if(s.rf>0)s.rf--;if(s.cs>0)s.cs--;if(x2>0)x2--;if(combo>0)combo=Math.max(0,combo-2);sv();ui()},1000);
ui();
</script>
</body>
</html>
