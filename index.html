<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LITWIN x MELLSTROY TAP</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-dark: #090b10;
      --card-bg: #131722;
      --card-border: #232a3b;
      --accent-green: #00ff88;
      --accent-gold: #ffcc00;
      --accent-purple: #a855f7;
      --text-main: #ffffff;
      --text-muted: #8b95a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #182032 0%, var(--bg-dark) 65%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px 18px;
      overflow: hidden;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    .pill {
      background: rgba(19, 23, 34, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill.gold { color: var(--accent-gold); border-color: rgba(255, 204, 0, 0.35); }
    .pill.level { color: var(--accent-green); border-color: rgba(0, 255, 136, 0.35); }

    .balance-section { text-align: center; margin-top: 6px; }

    .balance-value {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-row { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .stats-row span { color: var(--accent-green); font-weight: 700; }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 4px;
      margin: 8px 0 4px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-btn.active.litvin { background: linear-gradient(135deg, #059669, #10b981); color: #fff; }
    .mode-btn.active.mell { background: linear-gradient(135deg, #7e22ce, #ec4899); color: #fff; }

    .tap-area { display: flex; justify-content: center; align-items: center; flex: 1; margin: 4px 0; }

    .tap-circle {
      width: 215px;
      height: 215px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e293b, #0f172a);
      border: 5px solid var(--accent-green);
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.28);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.06s ease;
    }

    .tap-circle.mell-theme { border-color: #ec4899; box-shadow: 0 0 35px rgba(236, 72, 153, 0.35); }
    .tap-circle:active { transform: scale(0.94); }
    .tap-emoji { font-size: 52px; margin-bottom: 4px; }
    .tap-title { font-size: 17px; font-weight: 900; text-transform: uppercase; text-align: center; line-height: 1.15; }
    .tap-sub { font-size: 11px; color: var(--accent-gold); font-weight: 700; margin-top: 4px; }

    .floating-num {
      position: fixed;
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 255, 136, 0.8);
      pointer-events: none;
      animation: floatUp 0.85s ease-out forwards;
      z-index: 100;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.2); }
    }

    .energy-box { margin-bottom: 8px; }
    .energy-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .energy-bar-bg { width: 100%; height: 10px; background: #1e2433; border-radius: 999px; overflow: hidden; }
    .energy-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #00ff88, #00d4ff); transition: width 0.15s; }

    .upgrades-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .upgrade-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 9px 11px;
      cursor: pointer;
    }

    .upgrade-card.ad-card { border-color: rgba(255, 204, 0, 0.45); background: linear-gradient(145deg, #171c2b, #231d14); }
    .upgrade-card.stars-card { border-color: rgba(168, 85, 247, 0.5); background: linear-gradient(145deg, #171c2b, #23152e); }
    .card-top { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
    .card-desc { font-size: 11px; color: var(--accent-green); margin-bottom: 5px; }
    .card-price { font-size: 12px; font-weight: 800; color: var(--accent-gold); }
  </style>
</head>
  <body>
  <div class="top-bar">
    <div class="pill gold">🪙 КОЧ ГОЛДА: <span id="goldBalance">57</span></div>
    <div class="pill level">🏆 Ур. <span id="userLevel">1</span> • <span id="rankName">Поджигатель</span></div>
  </div>

  <div class="balance-section">
    <div class="balance-value" id="balanceDisplay">0</div>
    <div class="stats-row">
      Пассив: <span id="passiveDisplay">+0/с</span> • Тап: <span id="tapDisplay">+1</span>
    </div>
  </div>

  <div class="mode-switch">
    <button class="mode-btn active litvin" id="btnLitvin" onclick="switchCharacter('litvin')">🐆 ЛИТВИН</button>
    <button class="mode-btn mell" id="btnMell" onclick="switchCharacter('mell')">💸 МЕЛЛСТРОЙ</button>
  </div>

  <div class="tap-area">
    <div class="tap-circle" id="tapButton">
      <div class="tap-emoji" id="charEmoji">🐆🔥</div>
      <div class="tap-title" id="charTitle">ТАНЦУЙ<br>ПАНТЕРА</div>
      <div class="tap-sub" id="charBonus">Режим: Поджог Акулы</div>
    </div>
  </div>

  <div>
    <div class="energy-box">
      <div class="energy-header">
        <span>⚡ Энергия</span>
        <span><span id="energyCurrent">1000</span> / <span id="energyMax">1000</span></span>
      </div>
      <div class="energy-bar-bg">
        <div class="energy-bar-fill" id="energyFill"></div>
      </div>
    </div>

    <div class="upgrades-grid">
      <div class="upgrade-card" onclick="buyUpgrade('litEnergy')">
        <div class="card-top">🥫 Банка LIT</div>
        <div class="card-desc">+2 к силе тапа</div>
        <div class="card-price">💰 <span id="priceLit">100</span></div>
      </div>

      <div class="upgrade-card" onclick="buyUpgrade('mellDonate')">
        <div class="card-top">🎰 Донат от Мелла</div>
        <div class="card-desc">+5 в секунду (пассив)</div>
        <div class="card-price">💰 <span id="priceMell">250</span></div>
      </div>

      <div class="upgrade-card stars-card" onclick="buyStarsBoost()">
        <div class="card-top">💎 Занос x2 (Мелл)</div>
        <div class="card-desc">Удвоить тап навсегда</div>
        <div class="card-price">⭐ 25 Stars</div>
      </div>

      <div class="upgrade-card ad-card" onclick="refillEnergyWithAd()">
        <div class="card-top">🚀 Полный бак</div>
        <div class="card-desc">100% энергии за видео</div>
        <div class="card-price">🎬 СМОТРЕТЬ</div>
      </div>
    </div>
  </div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const userId = tg?.initDataUnsafe?.user?.id || 'local_player';
    const STORAGE_KEY = `litvin_mell_save_v2_${userId}`;

    const defaultState = {
      balance: 0, gold: 57, tapPower: 1, passiveIncome: 0,
      energy: 1000, maxEnergy: 1000, character: 'litvin',
      litLevel: 1, mellLevel: 0, multiplier: 1, lastSavedAt: Date.now()
    };

    function loadGame() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...defaultState };
        const merged = { ...defaultState, ...JSON.parse(raw) };
        const sec = Math.min(Math.floor((Date.now() - merged.lastSavedAt) / 1000), 10800);
        if (sec > 2) {
          const offlineEarned = sec * merged.passiveIncome;
          merged.balance += offlineEarned;
          merged.energy = Math.min(merged.maxEnergy, merged.energy + sec * 2);
          if (offlineEarned > 0 && tg?.showAlert) {
            setTimeout(() => tg.showAlert(`Меллстрой занёс в офлайне: +${offlineEarned.toLocaleString()}!`), 400);
          }
        }
        return merged;
      } catch (e) { return { ...defaultState }; }
    }

    let state = loadGame();

    function saveGame() {
      state.lastSavedAt = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function switchCharacter(char) {
      state.character = char;
      updateCharacterUI();
      saveGame();
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function updateCharacterUI() {
      const circle = document.getElementById('tapButton');
      const btnLit = document.getElementById('btnLitvin');
      const btnMell = document.getElementById('btnMell');
      if (state.character === 'mell') {
        circle.classList.add('mell-theme');
        btnMell.classList.add('active');
        btnLit.classList.remove('active');
        document.getElementById('charEmoji').textContent = '💸🎰';
        document.getElementById('charTitle').innerHTML = 'ЧТО ЗА БИЗНЕС<br>СУКА?!';
        document.getElementById('charBonus').textContent = 'Меллстрой: Шанс x3 крита';
      } else {
        circle.classList.remove('mell-theme');
        btnLit.classList.add('active');
        btnMell.classList.remove('active');
        document.getElementById('charEmoji').textContent = '🐆🔥';
        document.getElementById('charTitle').innerHTML = 'ТАНЦУЙ<br>ПАНТЕРА';
        document.getElementById('charBonus').textContent = 'Литвин: Стабильный фарм';
      }
    }

    document.getElementById('tapButton').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (state.energy < 1) return;
      const baseTap = state.tapPower * state.multiplier;
      const isCrit = state.character === 'mell' && Math.random() < 0.15;
      const earned = isCrit ? baseTap * 3 : baseTap;

      state.balance += earned;
      state.energy = Math.max(0, state.energy - 1);
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(isCrit ? 'heavy' : 'light');

      const el = document.createElement('div');
      el.className = 'floating-num';
      el.textContent = isCrit ? `🔥 +${earned}` : `+${earned}`;
      el.style.left = `${e.clientX - 20}px`;
      el.style.top = `${e.clientY - 25}px`;
      if (isCrit) { el.style.color = '#ffcc00'; el.style.fontSize = '30px'; }
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 850);

      renderUI();
      saveGame();
    });

    const getLitPrice = () => Math.floor(100 * Math.pow(1.6, state.litLevel - 1));
    const getMellPrice = () => Math.floor(250 * Math.pow(1.7, state.mellLevel));

    function buyUpgrade(type) {
      if (type === 'litEnergy') {
        const p = getLitPrice();
        if (state.balance < p) return tg?.showAlert?.('Не хватает монет!');
        state.balance -= p; state.litLevel++; state.tapPower += 2;
      } else if (type === 'mellDonate') {
        const p = getMellPrice();
        if (state.balance < p) return tg?.showAlert?.('Не хватает монет!');
        state.balance -= p; state.mellLevel++; state.passiveIncome += 5;
      }
      renderUI(); saveGame();
    }

    function buyStarsBoost() {
      tg?.showAlert?.('Подключите оплату Stars на сервере для активации буста x2.');
    }

    function refillEnergyWithAd() {
      state.energy = state.maxEnergy;
      renderUI(); saveGame();
      tg?.showAlert?.('Полный бак! Энергия 100%.');
    }

    function renderUI() {
      document.getElementById('balanceDisplay').textContent = Math.floor(state.balance).toLocaleString('ru-RU');
      document.getElementById('goldBalance').textContent = state.gold;
      document.getElementById('passiveDisplay').textContent = `+${state.passiveIncome}/с`;
      document.getElementById('tapDisplay').textContent = `+${state.tapPower * state.multiplier}`;
      const level = Math.floor(Math.log10(Math.max(10, state.balance)));
      const ranks = ['Новичок', 'Поджигатель', 'Суетолог', 'Акула', 'Босс заносов', 'Король контента'];
      document.getElementById('userLevel').textContent = level;
      document.getElementById('rankName').textContent = ranks[Math.min(level - 1, ranks.length - 1)];
      document.getElementById('energyCurrent').textContent = Math.floor(state.energy);
      document.getElementById('energyMax').textContent = state.maxEnergy;
      document.getElementById('energyFill').style.width = `${(state.energy / state.maxEnergy) * 100}%`;
      document.getElementById('priceLit').textContent = getLitPrice().toLocaleString('ru-RU');
      document.getElementById('priceMell').textContent = getMellPrice().toLocaleString('ru-RU');
    }

    setInterval(() => {
      if (state.passiveIncome > 0) state.balance += state.passiveIncome;
      if (state.energy < state.maxEnergy) state.energy = Math.min(state.maxEnergy, state.energy + 2);
      renderUI(); saveGame();
    }, 1000);

    updateCharacterUI();
    renderUI();
  </script>
</body>
</html>
